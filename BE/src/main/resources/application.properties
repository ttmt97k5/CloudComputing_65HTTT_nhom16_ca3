# Server
server.port=8080

# Database - Cloud SQL (MySQL)
# Thay YOUR_DB_HOST, YOUR_DB_NAME, YOUR_DB_USER, YOUR_DB_PASS
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:eduquiz}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:eduquiz-secret-key-change-in-production-very-long-string}
jwt.expiration=86400000

# Logging
logging.level.com.eduquiz=INFO
